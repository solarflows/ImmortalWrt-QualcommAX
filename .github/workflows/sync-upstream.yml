# ════════════════════════════════════════════════════════════════════════
# Upstream Sync & Rolling Canary Build
# 双轨自动同步工作流:
# 1. 以生产基底 nss-edma-julius 为起点派生并重置 nss-edma-rolling 分支
# 2. 在路径级保护盾 (merge=ours) 下合并 OpenWrt 官方 master 通用演进
# 3. 自动同步 ImmortalWrt 签名公钥
# 4. 强制推送更新至 origin/nss-edma-rolling
# 5. 调用 AutoWorkFlows 编译 Canary 固件工件 (不直接发 Release)
# 6. 本地质量门禁动态核验:
#    - 检验通过: 组织工件与 Release Notes, 发布 Pre-release 并推进 openwrt.sha
#    - 检验失败: 自动发 Issue 告警, 不阻断 CI, 不发 Release, SHA 绝不前进
# ════════════════════════════════════════════════════════════════════════
name: "Upstream Sync & Rolling Canary Build"

on:
  schedule:
    - cron: '0 18 * * 0'  # 每周日 18:00 UTC (北京时间周一凌晨 02:00)
  workflow_dispatch:
    inputs:
      force_sync:
        description: '强制执行同步与合并 (即使上游无新增提交)'
        type: boolean
        required: false
        default: false
      trigger_build:
        description: '同步后自动触发固件编译与质检'
        type: boolean
        required: false
        default: true
      target:
        description: '构建目标平台 (ipq807x / ipq60xx / both)'
        type: choice
        required: false
        default: 'ipq807x'
        options:
          - 'ipq807x'
          - 'ipq60xx'
          - 'both'
      require_signing:
        description: '要求有效签名密钥 (缺钥/坏钥时构建失败, 默认 false 允许试跑)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync_rolling:
    name: Sync OpenWrt & Refresh Rolling Branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      require_signing: ${{ steps.check.outputs.require_signing }}
      upstream_head: ${{ steps.check.outputs.upstream_head }}
      base_sha: ${{ steps.check.outputs.base_sha }}

    steps:
      - name: Prepare Build Matrix
        id: set-matrix
        run: |
          TARGET="${{ inputs.target || 'ipq807x' }}"
          if [ "$TARGET" = "both" ]; then
            echo 'matrix=[{"target":"ipq807x","tag_prefix":"ipq807x"},{"target":"ipq60xx","tag_prefix":"ipq60xx"}]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[{\"target\":\"$TARGET\",\"tag_prefix\":\"$TARGET\"}]" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Hub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true

      - name: Fetch OpenWrt Official Master
        run: |
          git remote add upstream-openwrt https://github.com/openwrt/openwrt.git 2>/dev/null || \
            git remote set-url upstream-openwrt https://github.com/openwrt/openwrt.git
          git fetch --no-tags upstream-openwrt master

      - name: Check for upstream changes & Keyring
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream-openwrt/master)
          BASE_SHA=$(cat .github/openwrt.sha 2>/dev/null | tr -d '[:space:]' || echo "")
          echo "Upstream OpenWrt Head: ${UPSTREAM_HEAD}"
          echo "Recorded Base SHA:     ${BASE_SHA}"

          echo "upstream_head=${UPSTREAM_HEAD}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "require_signing=${{ inputs.require_signing || false }}" >> "$GITHUB_OUTPUT"

          # 确保获取本地最新人工基底
          git fetch origin nss-edma-julius:nss-edma-julius --force

          # 同步并强校验 ImmortalWrt 官方快照签名公钥 (APK ECDSA + usign Ed25519)
          KEY_CHANGED="false"
          APK_KEY_URL="https://raw.githubusercontent.com/immortalwrt/keyring/master/apk/immortalwrt-snapshots.pem"
          USIGN_KEY_URL="https://raw.githubusercontent.com/immortalwrt/keyring/master/usign/8ead5420c4005b0d"

          if curl -fsSL --max-time 15 "$APK_KEY_URL" -o /tmp/immortalwrt-snapshots.pem && \
             [ "$(wc -c < /tmp/immortalwrt-snapshots.pem)" -gt 64 ] && \
             [ "$(wc -c < /tmp/immortalwrt-snapshots.pem)" -lt 512 ] && \
             openssl pkey -pubin -in /tmp/immortalwrt-snapshots.pem -noout >/dev/null 2>&1; then
            CUR_APK_HASH=$(git show nss-edma-julius:package/system/openwrt-keyring/files/apk/immortalwrt-snapshots.pem 2>/dev/null | sha256sum | awk '{print $1}' || echo "")
            NEW_APK_HASH=$(sha256sum /tmp/immortalwrt-snapshots.pem | awk '{print $1}')
            if [ "$CUR_APK_HASH" != "$NEW_APK_HASH" ]; then
              echo "ImmortalWrt APK public key update detected: ${CUR_APK_HASH:-none} -> ${NEW_APK_HASH}"
              KEY_CHANGED="true"
            fi
          else
            echo "::warning::Failed to fetch or validate ImmortalWrt APK public key; keeping existing key."
            rm -f /tmp/immortalwrt-snapshots.pem
          fi

          if curl -fsSL --max-time 15 "$USIGN_KEY_URL" -o /tmp/8ead5420c4005b0d && \
             [ "$(wc -c < /tmp/8ead5420c4005b0d)" -gt 40 ] && \
             [ "$(wc -c < /tmp/8ead5420c4005b0d)" -lt 256 ] && \
             grep -v '^untrusted comment:' /tmp/8ead5420c4005b0d | grep -qxE 'RWS[A-Za-z0-9+/=]{50,60}'; then
            CUR_USIGN_HASH=$(git show nss-edma-julius:package/system/openwrt-keyring/files/usign/8ead5420c4005b0d 2>/dev/null | sha256sum | awk '{print $1}' || echo "")
            NEW_USIGN_HASH=$(sha256sum /tmp/8ead5420c4005b0d | awk '{print $1}')
            if [ "$CUR_USIGN_HASH" != "$NEW_USIGN_HASH" ]; then
              echo "ImmortalWrt usign public key update detected: ${CUR_USIGN_HASH:-none} -> ${NEW_USIGN_HASH}"
              KEY_CHANGED="true"
            fi
          else
            echo "::warning::Failed to fetch or validate ImmortalWrt usign public key; keeping existing key."
            rm -f /tmp/8ead5420c4005b0d
          fi

          echo "key_changed=${KEY_CHANGED}" >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_HEAD" != "$BASE_SHA" ] || [ "$KEY_CHANGED" = "true" ] || [ "${{ inputs.force_sync }}" = "true" ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "Update or key rotation detected. Sync required."
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "Already aligned with OpenWrt master and ImmortalWrt keyring. Nothing to do."
          fi

      - name: Reset & Merge Protected Rolling Branch
        if: steps.check.outputs.has_update == 'true'
        run: |
          UPSTREAM_HEAD="${{ steps.check.outputs.upstream_head }}"
          BASE_SHA="${{ steps.check.outputs.base_sha }}"
          KEY_CHANGED="${{ steps.check.outputs.key_changed }}"

          # 1. 始终以最新人工真理源 nss-edma-julius 重置滚动分支
          echo "Resetting nss-edma-rolling branch from origin/nss-edma-julius..."
          git checkout -B nss-edma-rolling nss-edma-julius

          # 2. 动态注入硬件防护盾至 runner 的 .git/info/attributes 并启用 merge=ours 合并驱动
          echo "Configuring rolling merge=ours protection shield in .git/info/attributes..."
          mkdir -p .git/info
          printf "%s\n" \
            "target/linux/qualcommax/** merge=ours" \
            "package/kernel/mac80211/** merge=ours" \
            "package/nss/** merge=ours" > .git/info/attributes
          echo "Merging upstream OpenWrt master (${UPSTREAM_HEAD}) into nss-edma-rolling..."
          git config merge.ours.driver true
          MERGE_MSG=$(printf "chore(sync): rolling merge OpenWrt master into nss-edma-rolling\n\nProtected paths preserved:\n- target/linux/qualcommax\n- package/kernel/mac80211\n- package/nss")
          if ! git merge -X ours --allow-unrelated-histories --no-edit upstream-openwrt/master -m "$MERGE_MSG"; then
            echo "::error::Merge failed unexpectedly! Aborting."
            git merge --abort || true
            exit 1
          fi

          # 3. 第二道物理防线：彻底清除上游合并引入的新增文件，将受保护目录物理重置为基底分支
          echo "Applying secondary protection layer to hardware offload paths..."
          git rm -rf --quiet target/linux/qualcommax package/kernel/mac80211 package/nss 2>/dev/null || true
          git checkout nss-edma-julius -- target/linux/qualcommax package/kernel/mac80211 package/nss

          # 提交修正以收敛合并
          git add target/linux/qualcommax package/kernel/mac80211 package/nss
          if ! git diff --quiet --cached; then
            git commit --amend --no-edit || true
          fi

          # 断言受保护路径与本地真理源 nss-edma-julius 绝对 100% 零差异
          PROTECTED_DIFF=$(git diff nss-edma-julius -- target/linux/qualcommax package/kernel/mac80211 package/nss)
          if [ -n "$PROTECTED_DIFF" ]; then
            echo "::error::Protected path assertion failed: differences detected against nss-edma-julius!"
            echo "$PROTECTED_DIFF" | head -n 30
            exit 1
          fi
          echo "Protected hardware paths verified (zero diff against nss-edma-julius)."

          # 4. 注入更新后的快照公钥 (若有变更)
          if [ "$KEY_CHANGED" = "true" ]; then
            mkdir -p package/system/openwrt-keyring/files/apk package/system/openwrt-keyring/files/usign
            [ -f /tmp/immortalwrt-snapshots.pem ] && cp /tmp/immortalwrt-snapshots.pem package/system/openwrt-keyring/files/apk/immortalwrt-snapshots.pem
            [ -f /tmp/8ead5420c4005b0d ] && cp /tmp/8ead5420c4005b0d package/system/openwrt-keyring/files/usign/8ead5420c4005b0d
            git add package/system/openwrt-keyring/files/
            git commit -m "chore(keyring): sync ImmortalWrt snapshot public keys" || true
          fi

          # 5. 强制推送滚动分支至远端
          echo "Pushing updated nss-edma-rolling branch..."
          git push --force-with-lease origin nss-edma-rolling

  compile_canary:
    name: Compile Canary Firmware / ${{ matrix.target }}
    needs: sync_rolling
    if: needs.sync_rolling.outputs.has_update == 'true' && (inputs.trigger_build != false)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.sync_rolling.outputs.matrix) }}
    uses: solarflows/AutoWorkFlows/.github/workflows/compile-firmware.yml@main
    with:
      matrix_target:                      ${{ matrix.target }}
      matrix_repo:                        'solarflows/ImmortalWrt-QualcommAX'
      matrix_ref:                         'nss-edma-rolling'
      matrix_packages_branch:             'qualcommax'
      standard_packages_branch:           'qualcommax'
      matrix_release_repo:                ''
      matrix_passwall_repo:               ''
      defaults_repo:                      'solarflows/AutoWorkFlows'
      defaults_ref:                       'main'
      config_path:                        'configs'
      matrix_firmware_release_tag_prefix: ${{ matrix.tag_prefix }}
      version_prefix:                     'canary-V'
      cache_variant:                      'canary'
      require_signing:                    ${{ needs.sync_rolling.outputs.require_signing == 'true' }}
      collect_packages:                   'luci-app-passwall, luci-app-passwall2, luci-app-homeproxy, luci-i18n-passwall-zh-cn, luci-i18n-passwall2-zh-cn, luci-i18n-homeproxy-zh-cn, chinadns-ng, dns2socks, geoview, haproxy, hysteria, ipt2socks, microsocks, naiveproxy, shadowsocks-rust-sslocal, shadowsocks-rust-ssserver, shadowsocksr-libev, simple-obfs, shadow-tls, sing-box, tcping, tuic-client, v2ray-geoip, v2ray-geosite, v2ray-plugin, xray-core'
      upload_artifacts:                   true
      clean_cache:                        false
      free_disk_space:                    false
      publish_sdk_ib:                     false
    secrets:
      ACCESS_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
      APK_BUILD_KEY: ${{ secrets.APK_BUILD_KEY }}
      USIGN_KEY:     ${{ secrets.USIGN_KEY }}

  verify_and_publish:
    name: Verify & Publish Canary / ${{ matrix.target }}
    needs: [sync_rolling, compile_canary]
    if: always() && !cancelled() && needs.sync_rolling.result == 'success' && needs.sync_rolling.outputs.has_update == 'true' && needs.compile_canary.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.sync_rolling.outputs.matrix) }}
    outputs:
      healthy: ${{ steps.verify.outputs.healthy }}
    steps:
      - name: Checkout Hub repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Build Logs Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-build-log
          path: artifacts/build-log

      - name: Download Build Info Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-build-info
          path: artifacts/build-info

      - name: Download Firmware Release Tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-release
          path: artifacts/release-tar

      - name: Download Passwall Packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.target }}-passwall
          path: artifacts/passwall

      - name: Run Dynamic Canary Quality Gate
        id: verify
        run: |
          chmod +x .github/scripts/verify-canary-health.sh
          set +e
          .github/scripts/verify-canary-health.sh "${{ matrix.target }}" "artifacts" "/tmp/canary-health-report.md" "configs/${{ matrix.target }}"
          VERIFY_RC=$?
          set -e

          cat /tmp/canary-health-report.md >> "$GITHUB_STEP_SUMMARY"

          if [ $VERIFY_RC -eq 0 ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "HEALTHY=true" >> "$GITHUB_ENV"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "HEALTHY=false" >> "$GITHUB_ENV"
          fi

      - name: Alert on Unhealthy Canary (Create/Update Issue)
        if: env.HEALTHY != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=$(cat /tmp/canary-health-report.md)
          UPSTREAM_HEAD="${{ needs.sync_rolling.outputs.upstream_head }}"
          ISSUE_TITLE="CI Alert: Canary Quality Gate Failed for ${{ matrix.target }} (${UPSTREAM_HEAD:0:8})"

          EXISTING_ISSUE=$(gh issue list --repo "${{ github.repository }}" --label "rolling-alert" --state open --json number,title --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --repo "${{ github.repository }}" --body "$REPORT"
            echo "::notice::已在现有 Issue #${EXISTING_ISSUE} 追加健康度异常预警"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body "$REPORT" \
              --label "rolling-alert" 2>/dev/null || \
            gh issue create --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body "$REPORT"
            echo "::notice::已创建新的健康度异常预警 Issue"
          fi
          echo "::warning::Canary 固件质量门禁未通过，已记录告警并跳过发版（不阻断 CI 成功状态）"

      - name: Publish Verified Canary Release
        if: env.HEALTHY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ matrix.target }}"
          # 严格以 AutoWorkFlows 的 build-info.json 导出 Tag 为单一真理源，绝不自行计算
          RELEASE_TAG=""
          if [ -f "artifacts/build-info/build-info.json" ]; then
            RELEASE_TAG=$(jq -r '.release_tag // empty' artifacts/build-info/build-info.json 2>/dev/null || true)
          fi
          [ -n "$RELEASE_TAG" ] || RELEASE_TAG="${TARGET}-canary-V$(TZ='Asia/Shanghai' date +'%y%m%d')"
          PASSWALL_TAG="packages-${TARGET}-canary"
          REPO="${{ github.repository }}"

          mkdir -p /tmp/release-staging
          tar -xzf "artifacts/release-tar/${TARGET}-release.tar.gz" -C /tmp/release-staging

          UPSTREAM_HEAD="${{ needs.sync_rolling.outputs.upstream_head }}"
          BODY_FILE="/tmp/canary-release-notes.md"
          cat << 'EOF' > "$BODY_FILE"
          ## 🚀 ImmortalWrt QualcommAX Canary (Rolling Release)

          EOF
          echo "**构建目标**: \`${TARGET}\`  " >> "$BODY_FILE"
          echo "**同步 OpenWrt 上游基准**: [${UPSTREAM_HEAD:0:8}](https://github.com/openwrt/openwrt/commit/${UPSTREAM_HEAD})  " >> "$BODY_FILE"
          echo "**硬件防护状态**: 🟢 受物理保护盾（merge=ours）与动态自适应质量门禁守护  " >> "$BODY_FILE"
          echo "" >> "$BODY_FILE"
          if [ -f "artifacts/build-info/release-body.md" ]; then
            cat "artifacts/build-info/release-body.md" >> "$BODY_FILE"
          fi
          echo "" >> "$BODY_FILE"
          if [ -f "/tmp/canary-health-conclusion.md" ]; then
            cat "/tmp/canary-health-conclusion.md" >> "$BODY_FILE"
          elif grep -q "^\*\*判定结论\*\*:" /tmp/canary-health-report.md 2>/dev/null; then
            echo "### 🔍 固件质量门禁" >> "$BODY_FILE"
            grep "^\*\*判定结论\*\*:" /tmp/canary-health-report.md >> "$BODY_FILE"
          fi

          echo "📦 创建 / 更新 Canary 固件 Pre-release: ${RELEASE_TAG}"
          if ! gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$REPO" \
              --target "nss-edma-rolling" \
              --prerelease \
              --title "${TARGET} Canary Build ${RELEASE_TAG}" \
              --notes-file "$BODY_FILE"
          else
            gh release edit "$RELEASE_TAG" --repo "$REPO" \
              --prerelease \
              --title "${TARGET} Canary Build ${RELEASE_TAG}" \
              --notes-file "$BODY_FILE"
          fi

          # 逐文件上传固件资产 (若 Release 已存在, 清理非本次构建的历史残留固件)
          if [ -d "/tmp/release-staging/firmware" ]; then
            if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
              EXISTING_FIRMWARES=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -E '^openwrt-.*-qualcommax-' || true)
              for old_fw in $EXISTING_FIRMWARES; do
                if [ ! -f "/tmp/release-staging/firmware/$old_fw" ]; then
                  echo "🧹 清理非本次构建的历史残留固件: $old_fw"
                  gh release delete-asset "$RELEASE_TAG" "$old_fw" --repo "$REPO" --yes 2>/dev/null || true
                fi
              done
            fi
            find "/tmp/release-staging/firmware" -maxdepth 1 -type f -exec gh release upload "$RELEASE_TAG" {} --repo "$REPO" --clobber \;
          fi

          # 发布 Passwall Packages
          if [ -d "/tmp/release-staging/passwall" ] && [ -n "$(ls -A /tmp/release-staging/passwall 2>/dev/null)" ]; then
            echo "📦 发布 Canary Passwall 软件包: ${PASSWALL_TAG}"
            if ! gh release view "$PASSWALL_TAG" --repo "$REPO" >/dev/null 2>&1; then
              gh release create "$PASSWALL_TAG" --repo "$REPO" \
                --prerelease --latest=false \
                --title "Passwall Packages (${TARGET} Canary)" \
                --notes "Automated rolling packages for ${TARGET}"
            fi
            find "/tmp/release-staging/passwall" -maxdepth 1 -type f -exec gh release upload "$PASSWALL_TAG" {} --repo "$REPO" --clobber \;
          fi

  finalize_sync:
    name: Finalize Upstream Baseline Tracking
    needs: [sync_rolling, compile_canary, verify_and_publish]
    if: always() && !cancelled() && needs.sync_rolling.result == 'success' && (needs.verify_and_publish.outputs.healthy == 'true' || inputs.trigger_build == false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update recorded baseline in main branch
        run: |
          UPSTREAM_HEAD="${{ needs.sync_rolling.outputs.upstream_head }}"
          BASE_SHA="${{ needs.sync_rolling.outputs.base_sha }}"
          if [ -n "$UPSTREAM_HEAD" ] && [ "$UPSTREAM_HEAD" != "$BASE_SHA" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            echo "Updating recorded baseline in main branch: ${BASE_SHA} -> ${UPSTREAM_HEAD}"
            echo "$UPSTREAM_HEAD" > .github/openwrt.sha
            git add .github/openwrt.sha
            git commit -m "chore(sync): update OpenWrt base tracking SHA to ${UPSTREAM_HEAD} [skip ci]" || true
            git push origin main
          fi

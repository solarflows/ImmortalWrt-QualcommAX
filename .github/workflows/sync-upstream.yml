name: "Dual-Upstream Sync (Julius NSS-EDMA + ImmortalWrt)"

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if upstreams are unchanged'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  sync_and_rebase:
    name: Sync Dual Upstreams and Rebase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch both upstreams
        run: |
          # 1. Julius Bairaktaris NSS-EDMA Driver Core (Highest priority for QualcommAX)
          git remote add upstream_julius https://github.com/JuliusBairaktaris/openwrt-nss-edma.git || \
            git remote set-url upstream_julius https://github.com/JuliusBairaktaris/openwrt-nss-edma.git
          git fetch upstream_julius nss-edma-rework --force

          # 2. ImmortalWrt Ecosystem & Base Packages
          git remote add upstream_immortal https://github.com/immortalwrt/immortalwrt.git || \
            git remote set-url upstream_immortal https://github.com/immortalwrt/immortalwrt.git
          git fetch upstream_immortal master --force

      - name: Check for upstream updates
        id: check_update
        run: |
          # Check Julius NSS-EDMA updates
          JULIUS_HEAD=$(git rev-parse upstream_julius/nss-edma-rework)
          JULIUS_PREV=$(cat .github/julius.sha 2>/dev/null || echo "")
          echo "Julius NSS-EDMA head: ${JULIUS_HEAD}"
          echo "Julius previous sha:  ${JULIUS_PREV}"
          echo "julius_head=${JULIUS_HEAD}" >> "$GITHUB_OUTPUT"
          echo "julius_prev=${JULIUS_PREV}" >> "$GITHUB_OUTPUT"

          # Check ImmortalWrt updates
          IMMORTAL_HEAD=$(git rev-parse upstream_immortal/master)
          IMMORTAL_PREV=$(cat .github/immortal.sha 2>/dev/null || echo "")
          echo "ImmortalWrt head:     ${IMMORTAL_HEAD}"
          echo "ImmortalWrt previous: ${IMMORTAL_PREV}"
          echo "immortal_head=${IMMORTAL_HEAD}" >> "$GITHUB_OUTPUT"

          JULIUS_UPDATED=false
          IMMORTAL_UPDATED=false

          if [ "$JULIUS_HEAD" != "$JULIUS_PREV" ] || [ "${{ inputs.force_sync }}" = "true" ]; then
            JULIUS_UPDATED=true
          fi

          if [ "$IMMORTAL_HEAD" != "$IMMORTAL_PREV" ] || [ "${{ inputs.force_sync }}" = "true" ]; then
            IMMORTAL_UPDATED=true
          fi

          echo "julius_updated=${JULIUS_UPDATED}" >> "$GITHUB_OUTPUT"
          echo "immortal_updated=${IMMORTAL_UPDATED}" >> "$GITHUB_OUTPUT"

          if [ "$JULIUS_UPDATED" = "true" ] || [ "$IMMORTAL_UPDATED" = "true" ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "All upstreams are already up to date. Nothing to do."
          fi

      - name: Rebase and synthesize custom branch
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          git checkout nss-edma-custom

          # If ImmortalWrt upstream changed, rebase onto updated upstream_immortal/master
          if [ "${{ steps.check_update.outputs.immortal_updated }}" = "true" ]; then
            echo "Rebasing onto updated ImmortalWrt upstream..."
            if ! git rebase upstream_immortal/master; then
              echo "::warning::ImmortalWrt rebase conflict, resolving known config files..."
              git checkout --theirs feeds.conf.default 2>/dev/null || true
              git checkout --theirs .github/workflows/ 2>/dev/null || true
              git add feeds.conf.default .github/workflows/ 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
            echo "${{ steps.check_update.outputs.immortal_head }}" > .github/immortal.sha
            git add .github/immortal.sha
            git diff-index --quiet HEAD || git commit -m "sync(immortalwrt): update base to ${{ steps.check_update.outputs.immortal_head }}"
          fi

          # If Julius NSS-EDMA drivers changed, dynamically sync all modified paths from Julius
          if [ "${{ steps.check_update.outputs.julius_updated }}" = "true" ]; then
            echo "Syncing updated NSS-EDMA files from Julius..."
            PREV="${{ steps.check_update.outputs.julius_prev }}"
            HEAD="${{ steps.check_update.outputs.julius_head }}"

            if [ -n "$PREV" ]; then
              CHANGED_FILES=$(git diff --name-only "$PREV" "$HEAD" 2>/dev/null || true)
            else
              CHANGED_FILES=$(git diff --name-only "upstream_julius/nss-edma-rework~35" "$HEAD" 2>/dev/null || true)
            fi

            # Protect custom innovations from being overwritten
            PROTECTED="^(feeds\.conf\.default|\.github/workflows/|package/network/config/firewall4/|package/network/utils/fullconenat-sonic/|package/emortal/luci-app-fullconenat-sonic/|target/linux/generic/hack-6.18/98[456]-|target/linux/qualcommax/Makefile|target/linux/qualcommax/base-files/etc/config/nss_freq|target/linux/qualcommax/base-files/usr/bin/nss_freq|target/linux/qualcommax/base-files/etc/init\.d/set-irq-affinity|target/linux/qualcommax/base-files/etc/uci-defaults/)"

            SYNC_FILES=$(echo "$CHANGED_FILES" | grep -v -E "$PROTECTED" || true)

            if [ -n "$SYNC_FILES" ]; then
              echo "Discovered files updated by Julius:"
              echo "$SYNC_FILES"
              echo "$SYNC_FILES" | xargs -r git checkout "$HEAD" --
            fi

            # Ensure ATH11K_NSS_SUPPORT defaults to y on qualcommax
            sed -i 's/default n/default y if TARGET_qualcommax/' package/kernel/mac80211/ath.mk 2>/dev/null || true

            # Re-apply our custom hardware flags
            echo "Re-applying ARMv8 CE crypto, SONiC FullCone, and target tweaks..."
            if ! grep -q "CONFIG_ARM64_CRYPTO=y" target/linux/qualcommax/config-6.18; then
              printf '%s\n' \
                "CONFIG_ARM64_CRYPTO=y" \
                "CONFIG_CRYPTO_AES_ARM64_CE=y" \
                "CONFIG_CRYPTO_AES_ARM64_CE_BLK=y" \
                "CONFIG_CRYPTO_AES_ARM64_NEON_BLK=y" \
                "CONFIG_CRYPTO_SHA2_ARM64_CE=y" \
                "CONFIG_CRYPTO_GHASH_ARM64_CE=y" \
                "CONFIG_CRYPTO_CRC32_ARM64_CE=y" \
                "CONFIG_NF_NAT_FULLCONE=y" >> target/linux/qualcommax/config-6.18
            fi

            # Ensure custom feeds.conf.default stays intact
            printf '%s\n' \
              "src-git packages https://github.com/solarflows/packages.git;qualcommax" \
              "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss" \
              "src-git luci https://github.com/immortalwrt/luci.git" \
              "src-git routing https://github.com/openwrt/routing.git" \
              "src-git telephony https://github.com/openwrt/telephony.git" \
              "src-git video https://github.com/openwrt/video.git" > feeds.conf.default

            echo "${{ steps.check_update.outputs.julius_head }}" > .github/julius.sha
            git add -A
            git diff-index --quiet HEAD || git commit -m "sync(nss-edma): update QualcommAX drivers to ${{ steps.check_update.outputs.julius_head }}"
          fi

          echo "Pushing updated nss-edma-custom branch..."
          git push origin nss-edma-custom --force-with-lease

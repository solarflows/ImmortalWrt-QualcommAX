# ════════════════════════════════════════════════════════════════════════
# ImmortalWrt QualcommAX Builder (Caller Workflow)
# 纯粹的 Reusable Workflow 调度器，调用 AutoWorkFlows 核心编译流水线
# 固件产出、Release 与专属 10GB Cache 归属于本仓库
# ════════════════════════════════════════════════════════════════════════
name: "ImmortalWrt QualcommAX Builder"

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择构建目标 (ipq807x / ipq60xx / both)'
        required: true
        default: 'ipq807x'
        type: choice
        options:
          - 'ipq807x'
          - 'ipq60xx'
          - 'both'
      branch:
        description: '源码分支 (nss-edma-julius / nss-edma-rolling / nss-edma-custom)'
        required: false
        default: 'nss-edma-julius'
        type: choice
        options:
          - 'nss-edma-julius'
          - 'nss-edma-rolling'
          - 'nss-edma-custom'
      release_type:
        description: 'Release 发布类型 (release 正式 | prerelease 预发布 | draft 草稿)'
        required: false
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'prerelease'
          - 'draft'
      cache_variant:
        description: 'cache 命名空间变体 (空 = 默认 immwrt-v2-*; 非空 = 隔离 save/purge 快照, restore 仍跨变体暖启动)'
        required: false
        default: ''
        type: string
      require_signing:
        description: '要求有效签名密钥 (缺钥/坏钥时构建失败, 阻止未签名产物发布)'
        required: false
        default: false
        type: boolean
      version:
        description: '显式固件版本号 (如 V261011; 留空按版本前缀自动生成)'
        required: false
        default: ''
        type: string
      upload_artifacts:
        description: '上传 Actions 归档产物 (固件与 SDK 归档)'
        required: false
        default: true
        type: boolean
      clean_cache:
        description: '刷新缓存 (跳过缓存恢复, 强制重新编译)'
        required: false
        default: false
        type: boolean
      free_disk_space:
        description: '清理磁盘空间'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '18 22 * * 0'  # 每周日 22:18 UTC (北京时间每周一 06:18，一周运行一次)

permissions:
  actions: write
  contents: write

jobs:
  plan:
    name: Prepare Build Matrix
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - id: set-version
        run: |
          # 显式版本号优先，留空则由 reusable workflow 结合 version_prefix 自动推导
          VERSION="${{ inputs.version || '' }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - id: set-matrix
        run: |
          TARGET="${{ inputs.target || 'ipq807x' }}"
          if [ "$TARGET" = "both" ]; then
            echo 'matrix=[{"target":"ipq807x","tag_prefix":"ipq807x"},{"target":"ipq60xx","tag_prefix":"ipq60xx"}]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[{\"target\":\"$TARGET\",\"tag_prefix\":\"$TARGET\"}]" >> $GITHUB_OUTPUT
          fi

  compile:
    name: Compile Firmware / ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: solarflows/AutoWorkFlows/.github/workflows/compile-firmware.yml@main
    with:
      matrix_target:                      ${{ matrix.target }}
      matrix_repo:                        'solarflows/ImmortalWrt-QualcommAX'
      matrix_ref:                         ${{ inputs.branch || 'nss-edma-julius' }}
      matrix_packages_branch:             'qualcommax'
      standard_packages_branch:           'qualcommax'
      matrix_release_repo:                'solarflows/ImmortalWrt-QualcommAX'
      matrix_passwall_repo:               'solarflows/ImmortalWrt-QualcommAX'
      matrix_passwall_tag:                'packages-${{ matrix.target }}'
      matrix_firmware_release_tag_prefix: ${{ matrix.tag_prefix }}
      defaults_repo:                      'solarflows/AutoWorkFlows'
      defaults_ref:                       'main'
      config_path:                        'configs'
      version:                            ${{ needs.plan.outputs.version }}
      version_prefix:                     'V'
      release_type:                       ${{ inputs.release_type || 'release' }}
      require_signing:                    ${{ inputs.require_signing || false }}
      cache_variant:                      ${{ inputs.cache_variant || '' }}
      collect_packages:                   'luci-app-passwall, luci-app-passwall2, luci-app-homeproxy, luci-i18n-passwall-zh-cn, luci-i18n-passwall2-zh-cn, luci-i18n-homeproxy-zh-cn, chinadns-ng, dns2socks, geoview, haproxy, hysteria, ipt2socks, microsocks, naiveproxy, shadowsocks-rust-sslocal, shadowsocks-rust-ssserver, shadowsocksr-libev, simple-obfs, shadow-tls, sing-box, tcping, tuic-client, v2ray-geoip, v2ray-geosite, v2ray-plugin, xray-core'
      upload_artifacts:                   ${{ inputs.upload_artifacts != false }}
      clean_cache:                        ${{ inputs.clean_cache || false }}
      free_disk_space:                    ${{ inputs.free_disk_space || false }}
      publish_sdk_ib:                     false
    secrets:
      ACCESS_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
      APK_BUILD_KEY: ${{ secrets.APK_BUILD_KEY }}
      USIGN_KEY:     ${{ secrets.USIGN_KEY }}
